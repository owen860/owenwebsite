# This folder is the repository root, so Netlify needs no base directory:
# connect the repo, leave the build command empty, publish "public".
# There is no build step — the site is one HTML file plus three assets.
[build]
  publish = "public"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

# The font file is ~105 KB of base64 and never changes without a filename change.
[[headers]]
  for = "/fonts.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
