<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Join the waitlist</title>
<meta name="description" content="Save $200 by being the first to receive it. Join the waitlist and we'll email you the moment it opens.">
<meta property="og:title" content="Save $200 by being the first to receive it">
<meta property="og:description" content="Join the waitlist and we'll email you the moment it opens.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#060607">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&display=swap">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #060607;
    --fg: #ffffff;
    --muted: rgba(255, 255, 255, 0.62);
    --faint: rgba(255, 255, 255, 0.38);
    --line: rgba(255, 255, 255, 0.10);
    --field: #0a0a0d;
    --ember: #ff6a3d;                 /* left edge of the field, warm */
    --violet: #8b5cf6;                /* middle */
    --ice: #4c8dff;                   /* right edge, cool */
    --sans: 'BROmega', 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
  }

  /* Clip on the root, not on a flex wrapper: the field's glow and the artwork bleed
     sideways without adding a horizontal scrollbar, and y still scrolls normally. */
  html { color-scheme: dark; overflow-x: clip; -webkit-text-size-adjust: 100%; }

  body {
    min-height: 100dvh;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    overflow-x: hidden;               /* with the root clip: blooms bleed past the edge, no side-scroll on any browser */
  }

  /* ── Backdrop: the fire rising from the floor. Fixed, so it never scrolls out. ── */
  .glow {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background:
      radial-gradient(68% 30% at 50% 114%, rgba(255, 170, 90, 0.98) 0%, rgba(255, 118, 40, 0.95) 18%, rgba(232, 78, 20, 0.88) 40%, rgba(160, 44, 10, 0.55) 64%, transparent 90%),
      radial-gradient(46% 24% at 8% 112%, rgba(255, 120, 50, 0.85) 0%, transparent 72%),
      radial-gradient(46% 24% at 92% 112%, rgba(240, 90, 30, 0.65) 0%, transparent 72%),
      linear-gradient(180deg, #060607 0%, #060607 66%, #140803 83%, #401304 100%);
  }
  .shell { position: relative; z-index: 1; display: flex; flex-direction: column; min-height: 100dvh; }

  /* ── Header ─────────────────────────────────────────── */
  header {
    display: flex; align-items: center; justify-content: space-between; gap: 20px;
    padding: 22px 22px 0;
    max-width: 1240px; width: 100%; margin: 0 auto;
  }
  .wordmark { font-weight: 600; font-size: 15px; letter-spacing: -0.01em; color: var(--fg); }
  .badge {
    font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--faint);
    border: 1px solid var(--line); border-radius: 999px;
    padding: 6px 13px;
    white-space: nowrap;
  }

  /* ── Hero ───────────────────────────────────────────── */
  main {
    flex: 1;
    display: flex; flex-direction: column; justify-content: flex-start;
    max-width: 1240px; width: 100%; margin: 0 auto;
    padding: clamp(40px, 9vh, 88px) 22px 0;
    min-width: 0;
  }
  .hero { display: grid; grid-template-columns: minmax(0, 1fr); gap: 36px; min-width: 0; }
  .copy, .art { min-width: 0; }

  /* Phones read centred, like the reference. Desktop switches to left-aligned columns. */
  .copy { text-align: center; max-width: 560px; margin: 0 auto; width: 100%; }

  h1 {
    font-size: clamp(2.5rem, 10.2vw, 4.4rem);
    line-height: 1.0;
    letter-spacing: -0.035em;
    font-weight: 600;
    text-wrap: balance;
  }
  .lede {
    margin: 18px auto 0;
    font-size: clamp(1rem, 4.2vw, 1.125rem);
    color: var(--muted);
    max-width: 40ch;
    text-wrap: pretty;
  }

  /* ── The field ──────────────────────────────────────────────────────
     Layers, back to front: two coloured blooms (::before warm, ::after
     cool) → faint glyph texture → the box, whose 1px border is a gradient
     painted by padding:1px over the inner dark fill. Email and button share
     one row at every width.                     */
  .field-wrap { position: relative; margin: 46px auto 0; max-width: 520px; text-align: left; }
  .field-wrap::before,
  .field-wrap::after {
    content: ''; position: absolute; z-index: 0;
    top: -120%; height: 340%; width: 72%;
    border-radius: 50%;
    filter: blur(30px);
    opacity: 0.95;
    transition: opacity 0.5s var(--ease), transform 0.5s var(--ease);
  }
  .field-wrap::before { left: -16%;  background: radial-gradient(closest-side, rgba(255, 92, 60, 0.92), rgba(255, 92, 60, 0.32) 50%, transparent 80%); }
  .field-wrap::after  { right: -16%; background: radial-gradient(closest-side, rgba(76, 128, 255, 0.92), rgba(76, 128, 255, 0.30) 50%, transparent 80%); }
  .field-wrap:focus-within::before,
  .field-wrap:focus-within::after { opacity: 1; transform: scale(1.06); }

  .glyphs {
    position: absolute; z-index: 1; inset: -90% -14%;
    overflow: hidden;
    font: 10.5px/1.95 var(--mono);
    letter-spacing: 0.44em;
    white-space: pre;
    text-align: center;
    color: rgba(255, 255, 255, 0.26);
    pointer-events: none;
    -webkit-mask-image: radial-gradient(ellipse 60% 54% at 50% 50%, #000 0%, rgba(0, 0, 0, 0.5) 46%, transparent 76%);
            mask-image: radial-gradient(ellipse 60% 54% at 50% 50%, #000 0%, rgba(0, 0, 0, 0.5) 46%, transparent 76%);
  }

  .field {
    position: relative; z-index: 2;
    padding: 1px;
    border-radius: 20px;
    background: linear-gradient(100deg, rgba(255, 106, 61, 0.95) 0%, rgba(214, 84, 150, 0.85) 42%, rgba(139, 92, 246, 0.85) 70%, rgba(76, 141, 255, 0.95) 100%);
    box-shadow:
      -26px 0 64px -14px rgba(255, 96, 60, 0.55),
       26px 0 64px -14px rgba(76, 128, 255, 0.55),
       0 24px 60px -24px rgba(0, 0, 0, 0.8);
    transition: box-shadow 0.4s var(--ease);
  }
  .field-wrap:focus-within .field {
    box-shadow:
      -30px 0 74px -12px rgba(255, 96, 60, 0.7),
       30px 0 74px -12px rgba(76, 128, 255, 0.7),
       0 24px 60px -24px rgba(0, 0, 0, 0.8);
  }
  .field-inner {
    display: flex; align-items: center; gap: 10px;
    background: var(--field);
    border-radius: 19px;
    padding: 8px 8px 8px 20px;
  }

  input[type="email"] {
    flex: 1; min-width: 0;
    background: none; border: 0; outline: 0;
    color: var(--fg);
    font: inherit;
    font-size: 17px;                  /* ≥16px keeps iOS from zooming on focus */
    padding: 12px 0;
  }
  input[type="email"]::placeholder { color: rgba(255, 255, 255, 0.42); }

  .submit {
    display: inline-flex; align-items: center; gap: 8px;
    flex: none;
    font: inherit; font-size: 15px; font-weight: 600; letter-spacing: -0.005em;
    color: #fff;
    background: linear-gradient(135deg, #ff5d7a 0%, #b95cf0 55%, #6d6bff 100%);
    border: 0; border-radius: 999px;
    padding: 11px 16px 11px 18px;
    cursor: pointer;
    white-space: nowrap;
    box-shadow: 0 8px 26px -8px rgba(185, 92, 240, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.22);
    transition: transform 0.2s var(--ease), filter 0.2s var(--ease), opacity 0.2s var(--ease);
  }
  .submit svg { width: 15px; height: 15px; }
  .submit:hover { filter: brightness(1.08); }
  .submit:active { transform: scale(0.98); }
  .submit:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
  .submit[disabled] { opacity: 0.6; cursor: default; }

  .hp { position: absolute; left: -9999px; width: 1px; height: 1px; opacity: 0; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  .note { margin: 14px auto 0; font-size: 13.5px; color: var(--faint); min-height: 1.4em; max-width: 520px; }
  .note[data-state="error"] { color: #ff9c7a; }

  /* Success panel: same box, swapped in for the form. */
  .done { display: none; }
  .done .field-inner { display: flex; align-items: flex-start; gap: 14px; padding: 18px 20px; }
  .done .tick {
    flex: none; width: 26px; height: 26px; border-radius: 50%;
    background: linear-gradient(135deg, #ff5d7a, #6d6bff);
    display: grid; place-items: center; margin-top: 1px;
  }
  .done .tick svg { width: 13px; height: 13px; }
  .done strong { display: block; font-weight: 600; }
  .done span { color: var(--muted); font-size: 14.5px; }
  .is-done .done { display: block; }
  .is-done form { display: none; }

  /* ── Artwork: sits on the lit floor ─────────────────── */
  .art { position: relative; margin: 10px 0 0; }
  .art.missing { display: none; }            /* until monitors.webp exists: no broken-image icon */
  .art img {
    display: block; width: 92%; height: auto; margin: 0 auto;   /* phones: 92% of the column, centred */
    filter: drop-shadow(0 30px 36px rgba(0, 0, 0, 0.45));
  }

  /* ── ≥900px: copy left, artwork right, three-column glass grid ── */
  @media (min-width: 900px) {
    header { padding: 30px 40px 0; }
    main { padding: 24px 40px 56px; justify-content: center; }

    /* The art column runs off the right edge of the viewport, so the photo gets
       far more room than the 1240px container would allow. Height is capped so it
       never forces the page to scroll. */
    .hero { grid-template-columns: minmax(0, 470px) minmax(0, 1fr); align-items: center; gap: 48px; }
    .art img {
      width: 100%;
      max-height: clamp(380px, 66vh, 820px);
      object-fit: contain; object-position: center;
    }
    .copy { text-align: left; margin: 0; max-width: 560px; }
    h1 { font-size: clamp(3rem, 4.9vw, 4.4rem); line-height: 1.02; }
    .lede { margin-left: 0; }
    .field-wrap { margin-left: 0; }
    .note { margin-left: 0; }
    .art { margin-right: calc(-1 * ((100vw - min(100vw, 1240px)) / 2 + 40px)); }
    .hero:has(.art.missing) { grid-template-columns: minmax(0, 1fr); }
    .hero:has(.art.missing) .copy { margin: 0 auto; text-align: center; }
    .hero:has(.art.missing) .field-wrap, .hero:has(.art.missing) .note, .hero:has(.art.missing) .lede { margin-left: auto; margin-right: auto; }
  }
  @media (min-width: 1200px) { .hero { gap: 64px; } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; }
  }
</style>
</head>
<body>

<div class="glow" aria-hidden="true"></div>

<div class="shell">
  <header>
    <!-- Put the product's name or logo here. -->
    <span class="wordmark">Coming soon</span>
    <span class="badge">Early access</span>
  </header>

  <main>
    <div class="hero">

      <div class="copy">
        <h1>Save $200 by being the first to receive it</h1>

        <p class="lede">Leave your email and we’ll let you know the moment it’s ready — nothing in between.</p>

        <div class="field-wrap">
          <div class="glyphs" id="glyphs" aria-hidden="true"></div>

          <form class="field" id="waitlist" novalidate>
            <div class="field-inner">
              <label class="sr" for="email">Email address</label>
              <input
                id="email"
                name="email"
                type="email"
                inputmode="email"
                autocomplete="email"
                placeholder="Enter your email…"
                required
                aria-describedby="note">
              <button class="submit" type="submit">
                Join waitlist
                <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3 8h9.5M8.5 4l4 4-4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </button>
            </div>
            <!-- Bot trap: real people never fill this in. -->
            <input class="hp" type="text" name="company_website" tabindex="-1" autocomplete="off" aria-hidden="true">
          </form>

          <div class="field done" id="done" tabindex="-1">
            <div class="field-inner">
              <span class="tick" aria-hidden="true">
                <svg viewBox="0 0 16 16" fill="none"><path d="M2.5 8.5 6 12l7.5-8" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </span>
              <p>
                <strong>You’re on the list.</strong>
                <span id="doneMsg">We’ll email you as soon as it opens.</span>
              </p>
            </div>
          </div>
        </div>

        <p class="note" id="note" role="status" aria-live="polite"></p>
      </div>

      <div class="art">
        <!-- To use your own photograph: save it as monitors.webp (and an 800px-wide
             monitors-800.webp) in this folder, transparent background, and nothing
             else needs to change. -->
        <img
          src="monitors.webp"
          srcset="monitors-800.webp 800w, monitors.webp 1600w"
          sizes="(min-width: 900px) 62vw, 92vw"
          alt="A portable monitor on a tripod stand beside a laptop on a folding stand, both showing a pink and blue landscape"
          width="1379" height="1024"
          fetchpriority="high"
          onerror="this.closest('.art').classList.add('missing')">
      </div>

    </div>
  </main>
</div>

<script>
/* ──────────────────────────────────────────────────────────
   Klaviyo — fill these two in and the form is live.

   publicKey  Your 6-character public API key (Klaviyo calls it
              the Site ID): Settings → API keys → Public API key.
              It is designed to be public; safe in the browser.
   listId     The 6-character ID of the waitlist list:
              Audience → Lists & Segments → open the list → Settings.

   This posts to Klaviyo's client subscription endpoint, which is
   the one meant to be called from a browser. If the list has
   double opt-in switched on, Klaviyo sends the confirmation email
   itself and the profile only joins once the person confirms.
   ────────────────────────────────────────────────────────── */
const KLAVIYO = {
  publicKey: 'UZHuGv',
  listId: 'S2m24Y',
  revision: '2024-10-15',
  source: 'Waitlist page'
};

/* Faint character texture behind the field, as in the reference. Decorative only. */
(function () {
  const el = document.getElementById('glyphs');
  const set = 'ΣΩΔΦΨ≡±∞+*@&%#·0123456789ABCDEFHKMNPQRSTUVXZ';
  let out = '';
  for (let i = 0; i < 1080; i++) {
    out += Math.random() < 0.46 ? ' ' : set[Math.floor(Math.random() * set.length)];
    if (i % 54 === 53) out += '\n';
  }
  el.textContent = out;
})();

(function () {
  const form    = document.getElementById('waitlist');
  const input   = document.getElementById('email');
  const button  = form.querySelector('.submit');
  const note    = document.getElementById('note');
  const done    = document.getElementById('done');
  const doneMsg = document.getElementById('doneMsg');

  const say = (msg, state) => { note.textContent = msg; note.dataset.state = state || ''; };
  const looksLikeEmail = v => /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v);

  form.addEventListener('submit', async function (e) {
    e.preventDefault();

    // Honeypot filled in => bot. Show the success it expects, store nothing.
    if (form.company_website.value) { document.body.classList.add('is-done'); return; }

    const email = input.value.trim();
    if (!looksLikeEmail(email)) {
      say('Please enter a valid email address.', 'error');
      input.focus();
      return;
    }

    if (!KLAVIYO.publicKey || !KLAVIYO.listId) {
      say('The waitlist isn’t connected yet — add your Klaviyo keys.', 'error');
      console.error('[waitlist] Set KLAVIYO.publicKey and KLAVIYO.listId in index.html.');
      return;
    }

    button.disabled = true;
    const label = button.innerHTML;
    button.textContent = 'Joining…';
    say('');

    try {
      const res = await fetch(
        'https://a.klaviyo.com/client/subscriptions/?company_id=' + encodeURIComponent(KLAVIYO.publicKey),
        {
          method: 'POST',
          headers: { 'content-type': 'application/json', revision: KLAVIYO.revision },
          body: JSON.stringify({
            data: {
              type: 'subscription',
              attributes: {
                custom_source: KLAVIYO.source,
                profile: {
                  data: {
                    type: 'profile',
                    attributes: {
                      email: email,
                      subscriptions: { email: { marketing: { consent: 'SUBSCRIBED' } } }
                    }
                  }
                }
              },
              relationships: { list: { data: { type: 'list', id: KLAVIYO.listId } } }
            }
          })
        }
      );

      // Klaviyo answers 202 with an empty body on success.
      if (!res.ok) throw new Error('Klaviyo returned ' + res.status + ' ' + (await res.text()));

      doneMsg.textContent = 'We’ll email ' + email + ' as soon as it opens.';
      document.body.classList.add('is-done');
      done.focus();
    } catch (err) {
      console.error('[waitlist]', err);
      say('Something went wrong. Please try again.', 'error');
      button.disabled = false;
      button.innerHTML = label;
    }
  });

  input.addEventListener('input', () => { if (note.dataset.state === 'error') say(''); });
})();
</script>

</body>
</html>
